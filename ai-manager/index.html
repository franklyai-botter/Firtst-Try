<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="version" content="0.3.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#150f35">
<title>KI-WERKSTATT – Das AI-Enabling-Spiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   KI-WERKSTATT v0.3 – Mobile-Game-Look (iOS-Browser-Game-Stil)
   Theme & Assets: alles inline (SVG/CSS), echte Bilder später über
   die ASSET-Slots austauschbar (siehe BRAND/ASSETS im Script).
   ===================================================================== */
:root{
  --bg1:#161244; --bg2:#0e0c2a;
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.14);
  --text:#f2f1ff; --muted:#a7a3d1;
  --vio:#8b5cf6; --cyan:#22d3ee; --pink:#ec4899;
  --good:#34d399; --warn:#fbbf24; --bad:#f87171; --gold:#fbbf24;
  --grad-main:linear-gradient(135deg,#8b5cf6,#22d3ee);
  --grad-cta:linear-gradient(135deg,#f59e0b,#ec4899);
  --r:22px; --font:'Nunito',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:var(--font);color:var(--text);min-height:100vh;font-weight:600;
  background:radial-gradient(900px 600px at 85% -5%,#3b1e7a 0%,transparent 55%),
             radial-gradient(700px 500px at -10% 30%,#0e4b5e 0%,transparent 50%),
             linear-gradient(165deg,var(--bg1),var(--bg2) 70%);
  background-attachment:fixed;
}
button{font-family:var(--font);cursor:pointer;border:none;border-radius:14px;font-weight:800}
button:disabled{opacity:.4;cursor:not-allowed}
button:not(:disabled):active{transform:scale(.96)}
input,select{font-family:var(--font);background:rgba(0,0,0,.28);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:var(--muted)}
.vio{color:#c4b5fd}.cy{color:#67e8f9}.goldc{color:var(--gold)}

@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,.55)}50%{box-shadow:0 0 0 12px rgba(139,92,246,0)}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes confFall{to{transform:translateY(108vh) rotate(760deg)}}

/* ---------- Start ---------- */
#start-screen{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(800px 500px at 50% 0%,#3b1e7a 0%,transparent 60%),linear-gradient(165deg,var(--bg1),var(--bg2))}
.start-card{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:28px;
  padding:38px 34px;max-width:520px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:popIn .5s ease}
.logo-badge{width:92px;height:92px;margin:0 auto 14px;border-radius:26px;background:var(--grad-main);
  display:flex;align-items:center;justify-content:center;font-size:3rem;box-shadow:0 14px 34px rgba(139,92,246,.45);animation:floaty 3.5s ease-in-out infinite}
.logo{font-size:1.8rem;font-weight:900;letter-spacing:.04em}
.logo b{background:var(--grad-main);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{color:var(--muted);margin:10px 0 24px;font-size:.95rem;line-height:1.5}
.start-card label{display:block;text-align:left;color:var(--muted);font-size:.78rem;margin:14px 0 6px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.start-card input{width:100%;font-size:1rem}
.btn-primary{background:var(--grad-main);color:#fff;padding:15px 22px;font-size:1.05rem;margin-top:24px;width:100%;
  box-shadow:0 12px 28px rgba(139,92,246,.4)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted);padding:12px 18px;margin-top:12px;width:100%}
.btn-ghost:hover{color:var(--text);border-color:var(--vio)}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(14,12,42,.82);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.h-badge{width:44px;height:44px;border-radius:14px;background:var(--grad-main);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex:none}
.h-name{font-weight:900;line-height:1.15}
.h-sub{color:var(--muted);font-size:.72rem;font-weight:700}
.pill{background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.8rem;font-weight:800;white-space:nowrap}
.res{display:flex;gap:14px;margin-left:auto;align-items:center;flex-wrap:wrap}
.res-item{text-align:right;min-width:64px}
.res-item .lbl{font-size:.62rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.res-item .val{font-size:.98rem;font-weight:900}
.mgr-bar{width:100px;height:7px;background:rgba(0,0,0,.35);border-radius:4px;overflow:hidden;margin-top:4px}
.mgr-bar>div{height:100%;background:linear-gradient(90deg,var(--gold),#fde68a);border-radius:4px}
#btn-sim{background:var(--grad-cta);color:#fff;padding:13px 22px;font-size:1rem;box-shadow:0 10px 26px rgba(236,72,153,.4);animation:pulseGlow 2.4s infinite}
#btn-reset{background:transparent;border:1.5px solid var(--line);color:var(--muted);padding:9px 12px;font-size:.72rem}

/* ---------- Tabs ---------- */
nav{display:flex;gap:8px;padding:14px 16px 4px;flex-wrap:wrap;max-width:1280px;margin:0 auto}
nav button{background:var(--glass);border:1px solid var(--line);color:var(--muted);padding:10px 18px;border-radius:999px;font-size:.9rem;font-weight:800}
nav button.active{background:var(--grad-main);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(139,92,246,.35)}
main{padding:16px 16px 80px;max-width:1280px;margin:0 auto}

/* ---------- Cards ---------- */
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.card h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:12px;font-weight:900}
.kpi{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.9rem;gap:8px}
.kpi:last-child{border-bottom:none}
.kpi .v{font-weight:900}

/* ---------- Projekte ---------- */
.contract{background:var(--glass);backdrop-filter:blur(14px);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 34px rgba(0,0,0,.28);position:relative;overflow:hidden}
.contract.assigned-any{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.18),0 12px 34px rgba(0,0,0,.28)}
.contract.locked{opacity:.85}
.c-top{display:flex;gap:12px;align-items:center}
.client-logo{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;color:#fff;flex:none;box-shadow:0 8px 18px rgba(0,0,0,.3)}
.c-title{font-weight:900;font-size:1.02rem;line-height:1.2}
.c-client{color:var(--muted);font-size:.8rem;font-weight:700}
.uc-badge{margin-left:auto;flex:none;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.7rem;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:800;background:rgba(0,0,0,.18)}
.tag.uc{color:#67e8f9;border-color:rgba(103,232,249,.4)}
.c-row{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;align-items:center;font-weight:700}
.chance{font-weight:900}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(0,0,0,.25);border:1.5px solid var(--line);color:var(--text);border-radius:999px;padding:5px 12px 5px 5px;font-size:.8rem;display:flex;align-items:center;gap:7px;font-weight:800}
.chip .mini{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none}
.chip svg{display:block}
.chip.sel{background:rgba(34,211,238,.16);border-color:var(--cyan);color:#a5f3fc}
.addon{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:800}
.addon button{background:rgba(0,0,0,.25);border:1.5px solid var(--line);color:var(--muted);padding:6px 12px;font-size:.78rem;border-radius:999px}
.addon button.on{background:rgba(52,211,153,.16);border-color:var(--good);color:#a7f3d0}
.lock-hint{background:rgba(0,0,0,.3);border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:.82rem;color:var(--warn);font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lock-hint button{background:var(--grad-main);color:#fff;padding:6px 12px;font-size:.76rem;border-radius:999px}
.slots-info{margin:2px 2px 14px;color:var(--muted);font-size:.88rem;font-weight:700}

/* ---------- Team ---------- */
.agent{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.agent.out{border-color:var(--bad)}
.a-top{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.avatar{width:60px;height:60px;border-radius:18px;overflow:hidden;flex:none;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.avatar svg{display:block}
.a-name{font-weight:900;font-size:1.05rem}
.a-role{color:#c4b5fd;font-size:.78rem;font-weight:800}
.a-trait{color:var(--muted);font-size:.74rem;font-weight:700}
.lvl-chip{margin-left:auto;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:5px 10px;font-size:.78rem;font-weight:900;flex:none}
.statrow{display:flex;align-items:center;gap:8px;font-size:.76rem;margin:4px 0;font-weight:700}
.statrow .sl{width:96px;color:var(--muted)}
.statbar{flex:1;height:8px;background:rgba(0,0,0,.32);border-radius:5px;overflow:hidden}
.statbar>div{height:100%;background:var(--grad-main);border-radius:5px}
.statrow .sv{width:26px;text-align:right;font-weight:900}
.xpbar{height:6px;background:rgba(0,0,0,.32);border-radius:4px;overflow:hidden;margin-top:6px}
.xpbar>div{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),#fde68a,var(--gold));background-size:200% 100%;animation:shimmer 2.5s linear infinite}
.meters{display:flex;gap:12px;margin:10px 0 4px;font-size:.74rem;font-weight:800}
.meter{flex:1}
.meter .lbl{color:var(--muted);display:flex;justify-content:space-between}
.mbar{height:7px;background:rgba(0,0,0,.32);border-radius:4px;overflow:hidden;margin-top:4px}
.mbar>div{height:100%;border-radius:4px}
.a-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.btn-sm{background:var(--glass2);border:1.5px solid var(--line);color:var(--text);padding:8px 14px;font-size:.8rem;border-radius:12px}
.btn-sm:hover{border-color:var(--vio)}
.btn-sm.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn-sm.training-on{background:rgba(139,92,246,.22);border-color:var(--vio);color:#ddd6fe}
.btn-buy{background:var(--grad-main);color:#fff;padding:9px 16px;font-size:.82rem;border-radius:12px;box-shadow:0 8px 18px rgba(139,92,246,.35)}

/* ---------- Toolbox ---------- */
.tool{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tool:last-child{border:none}
.tool-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.tool-name{font-weight:900;font-size:.9rem}
.tool-desc{color:var(--muted);font-size:.74rem;font-weight:700}
.tool .own{margin-left:auto;flex:none}
.own-badge{background:rgba(52,211,153,.15);border:1px solid var(--good);color:#a7f3d0;border-radius:999px;padding:6px 13px;font-size:.75rem;font-weight:900}

/* ---------- Ranking ---------- */
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:900}
td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.06);font-weight:700}
tr.me td{background:rgba(34,211,238,.1);font-weight:900}
td.num,th.num{text-align:right}
.rank-medal{width:26px;display:inline-block}

/* ---------- Log ---------- */
.log{max-height:300px;overflow-y:auto;font-size:.82rem;display:flex;flex-direction:column;gap:7px;font-weight:700}
.log div{padding:8px 12px;background:rgba(0,0,0,.24);border-radius:12px;border-left:3px solid var(--line)}
.log .lg-good{border-left-color:var(--good)}.log .lg-bad{border-left-color:var(--bad)}.log .lg-ev{border-left-color:var(--vio)}

/* ---------- Skilltree ---------- */
.skill{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);gap:8px}
.skill:last-child{border:none}
.pips{display:flex;gap:5px}
.pip{width:13px;height:13px;border-radius:50%;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.pip.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(251,191,36,.6)}

/* ---------- Modal ---------- */
#modal-wrap{position:fixed;inset:0;background:rgba(5,4,20,.72);backdrop-filter:blur(6px);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:linear-gradient(170deg,rgba(46,38,96,.96),rgba(20,16,52,.97));border:1px solid var(--line);border-radius:26px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:26px 26px;box-shadow:0 30px 90px rgba(0,0,0,.65);animation:popIn .35s ease}
.modal h2{font-size:1.2rem;margin-bottom:14px;font-weight:900}
.modal h2.ev{color:#ddd6fe}
.report-item{padding:10px 14px;border-radius:14px;background:rgba(0,0,0,.24);margin-bottom:8px;font-size:.88rem;border-left:4px solid var(--line);font-weight:700}
.report-item.ok{border-left-color:var(--good)}.report-item.crit{border-left-color:var(--gold);background:rgba(251,191,36,.08)}
.report-item.fail{border-left-color:var(--warn)}.report-item.dis{border-left-color:var(--bad)}
.fin-row{display:flex;justify-content:space-between;font-size:.88rem;padding:4px 0;font-weight:700}
.modal-btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.modal-btns button{flex:1;padding:13px 16px;font-size:.95rem;border-radius:16px;min-width:150px}
.mb-main{background:var(--grad-main);color:#fff;box-shadow:0 10px 24px rgba(139,92,246,.4)}
.mb-alt{background:rgba(0,0,0,.28);border:1.5px solid var(--line);color:var(--text)}

/* ---------- Confetti / GameOver ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:15px;border-radius:3px;animation:confFall 2.4s ease-in forwards}
#gameover-screen{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(5,4,20,.92);padding:16px}
#gameover-screen.show{display:flex}

@media(max-width:640px){
  .res{gap:8px}.res-item{min-width:52px}
  main{padding:12px 10px 90px}
  #btn-sim{padding:11px 16px;font-size:.9rem}
}
</style>
</head>
<body>

<!-- ======================= START ======================= -->
<div id="start-screen">
  <div class="start-card">
    <div class="logo-badge">🛠️</div>
    <div class="logo">KI-<b>WERKSTATT</b></div>
    <div class="tagline">Führe deine eigene KI-Beratung.<br>Hilf Bäckerei, Autohaus &amp; Maschinenbau, mit KI durchzustarten –<br>und erlebe, wie AI-Enabling im Mittelstand wirklich funktioniert.</div>
    <label for="inp-company">Name deiner Beratung</label>
    <input id="inp-company" maxlength="24" placeholder="z. B. NeuralNautic">
    <label for="inp-manager">Dein Name</label>
    <input id="inp-manager" maxlength="20" placeholder="z. B. Frank">
    <button class="btn-primary" id="btn-found" onclick="foundCompany()">🚀 Beratung gründen</button>
    <button class="btn-ghost hidden" id="btn-continue" onclick="continueGame()">Gespeicherten Stand fortsetzen</button>
  </div>
</div>

<!-- ======================= GAME ======================= -->
<div id="game" class="hidden">
<header>
  <div class="h-badge">🛠️</div>
  <div>
    <div class="h-name" id="h-company"></div>
    <div class="h-sub" id="h-sub"></div>
  </div>
  <span class="pill" id="h-league"></span>
  <span class="pill" id="h-week"></span>
  <div class="res">
    <div class="res-item"><div class="lbl">Budget</div><div class="val num" id="h-credits"></div></div>
    <div class="res-item"><div class="lbl">Ruf</div><div class="val num" id="h-rep"></div></div>
    <div class="res-item"><div class="lbl">Team</div><div class="val num" id="h-slots"></div></div>
    <div class="res-item">
      <div class="lbl">Manager <span id="h-mlvl"></span></div>
      <div class="mgr-bar"><div id="h-mxp" style="width:0%"></div></div>
    </div>
    <button id="btn-sim" onclick="simulateWeek()">▶ Woche starten</button>
    <button id="btn-reset" onclick="resetGame()" title="Spielstand löschen">↺</button>
  </div>
</header>

<nav>
  <button data-tab="zentrale" class="active" onclick="showTab('zentrale')">🏠 Zentrale</button>
  <button data-tab="auftraege" onclick="showTab('auftraege')">📋 Projekte</button>
  <button data-tab="team" onclick="showTab('team')">👥 Team</button>
  <button data-tab="markt" onclick="showTab('markt')">🤝 Recruiting</button>
  <button data-tab="liga" onclick="showTab('liga')">🏆 Markt</button>
</nav>

<main>
  <div id="tab-zentrale"></div>
  <div id="tab-auftraege" class="hidden"></div>
  <div id="tab-team" class="hidden"></div>
  <div id="tab-markt" class="hidden"></div>
  <div id="tab-liga" class="hidden"></div>
</main>
</div>

<div id="modal-wrap" class="hidden"><div class="modal" id="modal-content"></div></div>
<div id="gameover-screen"><div class="start-card" id="gameover-card"></div></div>

<script>
'use strict';
/* =====================================================================
   KI-WERKSTATT v0.3 – AI-Enabling für KMUs als Manager-Spiel
   Du führst eine KI-Beratung: Berater:innen + KI-Toolbox treffen auf
   echte KMU-Use-Cases. Kernmechanik: Technik UND Akzeptanz müssen
   stimmen – ohne Schulung scheitert auch perfekte Technik.
   ===================================================================== */

const SAVE_KEY = 'aimanager_save_v3';
const DEMO_WEEKS = 12;
const QUARTER_LEN = 4;

/* Branding + Asset-Slots: hier später Logo/Bilder/CTA der Agentur eintragen */
const BRAND = {
  agency: 'NeuralNautic',
  ctaText: 'Sprechen wir über Ihren Use Case',
  ctaUrl: 'https://neuralnautic.org',
  logoEmoji: '🛠️',           // ASSET-Slot: später <img>-Logo
  heroImage: null,            // ASSET-Slot: Start-Illustration (URL/Base64)
};

const SKILLS_C = { technik:'Technik', prozesse:'Prozesse', didaktik:'Didaktik', branche:'Branchenwissen', kommunikation:'Kommunikation', sorgfalt:'Sorgfalt' };

const ROLES = [
  { id:'dev',    name:'KI-Entwickler:in',   focus:['technik','sorgfalt'] },
  { id:'proz',   name:'Prozess-Analyst:in', focus:['prozesse','branche'] },
  { id:'coach',  name:'KI-Coach',           focus:['didaktik','kommunikation'] },
  { id:'allr',   name:'Allrounder:in',      focus:['technik','prozesse'] },
  { id:'sales',  name:'Kundenversteher:in', focus:['kommunikation','branche'] },
];

const TRAITS = [
  { id:'marathon', name:'Marathon-Typ',   desc:'Energie sinkt langsamer',            condMult:.6 },
  { id:'prima',    name:'Primadonna',     desc:'Stimmung schwankt stark',            moraleMult:1.6 },

/* ---------------- Team-Generierung ---------------- */
function makeConsultant(tier,qualityBonus=0){
  const role=pick(ROLES), trait=pick(TRAITS);
  const L=SEGMENTS[tier];
  const base=Math.round((L.power[0]+L.power[1])/2)-8+qualityBonus;
  const stats={};
  for(const k of Object.keys(SKILLS_C)){
    let v=base+rnd(-9,9);
    if(role.focus.includes(k)) v+=rnd(6,14);
    stats[k]=clamp(v,5,99);
  }
  const avg=Object.values(stats).reduce((a,b)=>a+b,0)/6;
  const level=1+Math.max(0,Math.round((avg-25)/8));
  return {
    id:uid++, seed:rnd(1,999999999),
    name:pick(FIRST)+' '+pick(LAST), role:role.id, trait:trait.id,
    level, xp:0, stats, cond:100, morale:70,
    salary:Math.round((60+level*14+avg*1.9)*(trait.salaryMult||1)),
    value:Math.round(avg*30+level*120), out:0,
  };
}
function roleOf(a){ return ROLES.find(x=>x.id===a.role); }
function traitOf(a){ return TRAITS.find(x=>x.id===a.trait); }
function powerAvg(a){ return Object.values(a.stats).reduce((x,y)=>x+y,0)/6; }
function bestConsultant(s){ return [...s.team].sort((a,b)=>powerAvg(b)-powerAvg(a))[0]; }
function removeConsultant(s,id){
  s.team=s.team.filter(a=>a.id!==id);
  s.contracts.forEach(c=>c.assigned=c.assigned.filter(x=>x!==id));
  if(s.training&&s.training.agentId===id) s.training=null;
}

/* ---------------- Projekte ---------------- */
function makeContract(s){
  const tier=s.tier, L=SEGMENTS[tier];
  const ucKey=pick(Object.keys(USECASES));
  const kind=Math.random();
  let diff,repGain,label;
  if(kind<0.4){ diff=L.diff+rnd(-12,-4); repGain=1; label='Leicht'; }
  else if(kind<0.75){ diff=L.diff+rnd(-3,5); repGain=2; label='Mittel'; }
  else if(kind<0.93){ diff=L.diff+rnd(6,14); repGain=3; label='Schwer'; }
  else { diff=L.diff+rnd(15,24); repGain=4; label='Prestige'; }
  const nego=1+0.04*(s.skills.vertrieb||0);
  const client=pick(CLIENTS[tier]);
  return {
    id:uid++, title:pick(JOB_TITLES[ucKey]), client:client[0], branche:client[1],
    uc:ucKey, diff, label, reward:Math.round(diff*17*L.reward*(0.9+Math.random()*0.3)*nego),
    rep:repGain, assigned:[], schulung:false,
  };
}
function refreshContracts(s){
  const n=4+(s.rep>=60?1:0)+(s.rep>=85?1:0);
  s.contracts=[];
  for(let i=0;i<n;i++){
    let c=makeContract(s), tries=0;
    while(tries++<6&&s.contracts.some(x=>x.client===c.client)) c=makeContract(s);
    s.contracts.push(c);
  }
  /* Mindestens 2 sofort spielbare Projekte garantieren */
  let guard=0;
  while(s.contracts.filter(c=>hasTool(s,c)).length<2&&guard++<30){
    s.contracts[rnd(0,n-1)]=makeContract(s);
  }
}
function refreshMarket(s){
  const n=3+Math.ceil((s.skills.recruiting||0)/2);
  const q=(s.skills.recruiting||0)*4;
  s.market=[]; for(let i=0;i<n;i++){
    const a=makeConsultant(s.tier,q+rnd(-3,6));
    a.price=Math.round(a.value*1.2);
    s.market.push(a);
  }
}
function makeRivals(tier){
  const L=SEGMENTS[tier];
  const names=[...RIVAL_NAMES].sort(()=>Math.random()-0.5).slice(0,7);
  return names.map(n=>({ name:n, power:rnd(L.power[0],L.power[1]), qRev:0 }));
}

function newState(company,manager){
  const s={

    mgrLevel:1, mgrXp:0, skillPoints:0,

    team:[], contracts:[], market:[], rivals:makeRivals(0),
    qRevenue:0, totalRevenue:0, projectsDone:0, projectsFailed:0,
    training:null,
    insolvencyWarnings:0, buffReward:1, log:[],
    trophies:[], insights:{}, demoDone:false,
  };
  for(let i=0;i<3;i++) s.team.push(makeConsultant(0, i===0?6:0));
  refreshContracts(s); refreshMarket(s);
  addLog(s,'ev','Willkommen, '+manager+'! '+company+' berät ab sofort Kleinstbetriebe. Wähle Projekte, stelle dein Team zusammen – und vergiss die Schulung nicht!');

function addLog(s,type,msg){ s.log.unshift({type,msg,w:'W'+s.week}); s.log=s.log.slice(0,40); }

/* ---------------- Zuweisung ---------------- */
function slots(s){ return s.team.length; }
function usedSlots(s){ return s.contracts.reduce((n,c)=>n+c.assigned.length,0); }
function busy(s,id){
  if(s.training&&s.training.agentId===id) return true;
  return s.contracts.some(c=>c.assigned.includes(id));
}
function hasTool(s,c){ const t=USECASES[c.uc].tool; return !t||s.tools[t]; }
function toggleAssign(cid,aid){
  const c=state.contracts.find(x=>x.id===cid); if(!c||!hasTool(state,c)) return;
  const i=c.assigned.indexOf(aid);
  if(i>=0){ c.assigned.splice(i,1); }
  else{
    const a=state.team.find(x=>x.id===aid);
    if(!a||a.out>0||busy(state,aid)) return;
    if(c.assigned.length>=2) return;
    c.assigned.push(aid);
  }
  render();
}
function toggleSchulung(cid){
  const c=state.contracts.find(x=>x.id===cid); if(!c) return;
  if(!c.schulung&&state.credits<150) return;
  c.schulung=!c.schulung;
  render();
}

/* ---------------- Berechnung ---------------- */
function projectPower(s,c){
  const uc=USECASES[c.uc];
  const list=c.assigned.map(id=>s.team.find(a=>a.id===id)).filter(Boolean);
  const weights=[1,0.6];
  const scored=list.map(a=>{
    let p=0.55*a.stats[uc.skills[0]]+0.3*a.stats[uc.skills[1]]+0.15*a.stats.sorgfalt;
    let condF=0.5+0.5*(a.cond/100); if(a.cond<30) condF*=0.7;
    let morF=0.8+0.4*(a.morale/100);
    return p*condF*morF;
  }).sort((a,b)=>b-a);
  return scored.reduce((sum,v,i)=>sum+v*(weights[i]||0),0);
}
function projectChance(s,c){
  if(c.assigned.length===0) return 0;
  return clamp(Math.round(50+(projectPower(s,c)-c.diff)*1.2+2*(s.skills.methodik||0)),5,95);
}
function adoptionScore(s,c){
  const list=c.assigned.map(id=>s.team.find(a=>a.id===id)).filter(Boolean);
  if(list.length===0) return 0;
  const soft=list.reduce((n,a)=>n+a.stats.didaktik*0.5+a.stats.kommunikation*0.5,0)/list.length;
  let sc=35+soft*0.55+5*(s.skills.didaktik||0);
  if(c.schulung) sc+=25;
  if(s.tools.academy) sc+=10;
  return clamp(Math.round(sc),5,99);
}

/* ---------------- XP / Level ---------------- */
function xpNeed(level){ return Math.round(80*Math.pow(level,1.35)); }
function addXp(s,a,amount){
  a.xp+=Math.round(amount*(traitOf(a).xpMult||1));
  while(a.xp>=xpNeed(a.level)&&a.level<30){
    a.xp-=xpNeed(a.level); a.level++;
    const r=roleOf(a);
    a.stats[r.focus[0]]=clamp(a.stats[r.focus[0]]+2,1,100);
    for(let i=0;i<2;i++){ const k=pick(Object.keys(SKILLS_C)); a.stats[k]=clamp(a.stats[k]+1,1,100); }
    a.value=Math.round(a.value*1.18);
    addLog(s,'good','⬆ '+a.name+' erreicht Level '+a.level+'!');
  }
}
function mgrXpNeed(level){ return Math.round(100*Math.pow(level,1.5)); }
function addMgrXp(s,amount){
  s.mgrXp+=amount;
  while(s.mgrXp>=mgrXpNeed(s.mgrLevel)){
    s.mgrXp-=mgrXpNeed(s.mgrLevel); s.mgrLevel++; s.skillPoints++;
    addLog(s,'good','🎓 Manager-Level '+s.mgrLevel+'! +1 Skillpunkt.');
  }
}

/* ---------------- Wochensimulation ---------------- */
function simulateWeek(){
  const s=state;
  const report={results:[],fin:[],event:null,quarter:null,final:false,gameover:false,didWork:false,hadTraining:false,hadDisaster:false,hadAdoptFail:false,hadCrit:false};
  let income=0, expense=0;
  s.week_extra_cost=0;

  /* 1) Projekte auflösen: Technik UND Akzeptanz müssen stimmen */
  for(const c of s.contracts){
    if(c.assigned.length===0) continue;
    if(c.schulung) expense+=150;
    const chance=projectChance(s,c);
    const adopt=adoptionScore(s,c);
    const people=c.assigned.map(id=>s.team.find(a=>a.id===id)).filter(Boolean);
    let disasterRisk=10-2*(s.skills.methodik||0);
    for(const a of people){ disasterRisk+=(traitOf(a).disaster||0); disasterRisk-=a.stats.sorgfalt*0.06; }
    disasterRisk=clamp(disasterRisk,2,30);
    const techOK=Math.random()*100<chance;
    const adoptOK=Math.random()*100<adopt;
    report.didWork=true;
    if(techOK&&adoptOK){
      const crit=Math.random()*100<16;
      if(crit) report.hadCrit=true;
      const gain=Math.round(c.reward*(crit?1.4:1)*s.buffReward);
      const repGain=c.rep+(crit?2:0);
      income+=gain; s.rep=clamp(s.rep+repGain,0,100);
      s.qRevenue+=gain; s.totalRevenue+=gain; s.projectsDone++;
      people.forEach(a=>{ addXp(s,a,c.diff*(crit?1.5:1.2)); a.morale=clamp(a.morale+(traitOf(a).moraleMult||1)*4,0,100); });
      addMgrXp(s,15+(crit?25:0));
      report.results.push({cls:crit?'crit':'ok', txt:(crit?'🌟 Leuchtturm-Projekt':'✅ Erfolg')+' – „'+c.title+'“ ('+c.client+'): +'+fmt(gain)+' €, +'+repGain+' Ruf'});
      addLog(s,'good',(crit?'🌟 ':'✅ ')+c.client+': '+c.title+' (+'+fmt(gain)+' €)');
    } else if(techOK&&!adoptOK){
      report.hadAdoptFail=true;
      const gain=Math.round(c.reward*0.4);
      income+=gain; s.qRevenue+=gain; s.totalRevenue+=gain;
      s.rep=clamp(s.rep-3,0,100); s.projectsFailed++;
      people.forEach(a=>{ addXp(s,a,c.diff*0.8); a.morale=clamp(a.morale-5,0,100); });
      report.results.push({cls:'fail', txt:'😕 Nicht angenommen – „'+c.title+'“ ('+c.client+'): Technik lief, aber das Team nutzt sie nicht (Akzeptanz '+adopt+' %). Nur +'+fmt(gain)+' €, −3 Ruf'});
      addLog(s,'bad','😕 '+c.client+': Lösung wird nicht genutzt');
    } else {
      s.projectsFailed++;
      const dis=Math.random()*100<disasterRisk;
      if(dis){
        report.hadDisaster=true;
        const penalty=Math.round(c.reward*0.2);
        expense+=penalty; s.rep=clamp(s.rep-6,0,100);
        report.results.push({cls:'dis', txt:'💥 Panne – „'+c.title+'“ ('+c.client+'): Fehler im Livebetrieb! −'+fmt(penalty)+' €, −6 Ruf'});
        addLog(s,'bad','💥 Panne bei '+c.client+' (−'+fmt(penalty)+' €)');
      } else {
        s.rep=clamp(s.rep-2,0,100);
        report.results.push({cls:'fail', txt:'❌ Gescheitert – „'+c.title+'“ ('+c.client+', '+chance+' % Chance): −2 Ruf'});
        addLog(s,'bad','❌ '+c.client+': '+c.title+' gescheitert');
      }
      people.forEach(a=>{ addXp(s,a,c.diff*0.6); a.morale=clamp(a.morale-(traitOf(a).moraleMult||1)*(dis?12:7),0,100); });
    }
  }
  /* Liegengelassene Anfragen gehen an die Konkurrenz */
  let lost=0, lostRev=0;
  for(const c of s.contracts){
    if(c.assigned.length===0){ const r=pick(s.rivals); r.qRev+=c.reward; lost++; lostRev+=c.reward; }
  }
  if(lost>0) report.results.push({cls:'fail', txt:'🏃 '+lost+' Anfrage'+(lost>1?'n':'')+' ('+fmt(lostRev)+' €) gingen an die Konkurrenz.'});
  s.buffReward=1;

  /* 2) Weiterbildung */
  if(s.training){
    const a=s.team.find(x=>x.id===s.training.agentId);
    if(a&&a.out===0){
      const gain=3+rnd(0,2)+(s.skills.methodik||0);
      a.stats[s.training.stat]=clamp(a.stats[s.training.stat]+gain,1,100);
      a.cond=clamp(a.cond-15,0,100);
      addXp(s,a,25);
      report.hadTraining=true;
      report.results.push({cls:'ok',txt:'🏋️ Weiterbildung: '+a.name+' +'+gain+' '+SKILLS_C[s.training.stat]});
    }
    s.training=null;
  }

  /* 3) Energie, Stimmung, Ausfall */
  const worked=new Set(); s.contracts.forEach(c=>c.assigned.forEach(id=>worked.add(id)));
  for(const a of s.team){
    const t=traitOf(a);
    if(a.out>0){ a.out--; a.cond=clamp(a.cond+25,0,100); continue; }
    if(worked.has(a.id)){
      a.cond=clamp(a.cond-Math.round(22*(t.condMult||1)),0,100);
      if(a.cond<30&&Math.random()<0.35){
        a.out=rnd(1,2);
        report.results.push({cls:'dis',txt:'🤒 Überlastet: '+a.name+' fällt '+a.out+' Woche(n) aus!'});
        addLog(s,'bad','🤒 '+a.name+' ist ausgebrannt ('+a.out+' Wo.)');
      }
    } else {
      a.cond=clamp(a.cond+18,0,100);
      a.morale=clamp(a.morale+(a.morale<60?2:a.morale>60?-1:0),0,100);
    }
  }

  /* 4) Finanzen */
  const salaries=s.team.reduce((n,a)=>n+a.salary,0);
  const cloud=100+40*Object.values(s.tools).filter(Boolean).length;
  const fixcost=SEGMENTS[s.tier].fixcost;
  const schulungCost=s.contracts.filter(c=>c.assigned.length&&c.schulung).length*150;
  expense+=salaries+cloud+fixcost;
  s.credits+=income-expense;
  report.fin.push(['Projekthonorare','+'+fmt(income)]);
  if(schulungCost) report.fin.push(['Schulungs-Add-ons','−'+fmt(schulungCost)]);
  report.fin.push(['Gehälter','−'+fmt(salaries)]);
  report.fin.push(['KI-Tools & Cloud','−'+fmt(cloud)]);
  report.fin.push(['Büro ('+SEGMENTS[s.tier].name+')','−'+fmt(fixcost)]);
  if(s.week_extra_cost) report.fin.push(['Sonderkosten (Ereignis)','−'+fmt(s.week_extra_cost)]);
  report.fin.push(['Bilanz',(income-expense>=0?'+':'−')+fmt(Math.abs(income-expense))]);

  /* 5) Umsatz der Konkurrenz */
  const Lg=SEGMENTS[s.tier];
  for(const r of s.rivals) r.qRev+=Math.round(r.power*25*(0.55+Math.random()*0.9)*Lg.reward);

  /* 6) Ereignis */
  const ev=pick(EVENTS);
  report.event=ev;
  if(ev.effect){ s.lastEventNote=null; ev.effect(s); addLog(s,'ev','📡 '+ev.title); }

  /* 7) Manager-XP */
  addMgrXp(s,20);

  /* 8) Insolvenz */
  if(s.credits<0){
    s.insolvencyWarnings++;
    if(s.insolvencyWarnings>=2) report.gameover=true;
    else report.fin.push(['⚠ MAHNUNG','Konto im Minus! Noch 1 Woche.']);
  } else s.insolvencyWarnings=0;

  /* 9) Quartal / Abschluss */
  s.week++;
  const fw=s.week-1;
  if(!report.gameover){
    if(fw%QUARTER_LEN===0) report.quarter=endQuarter(s);
    if(fw===DEMO_WEEKS&&!s.demoDone){ s.demoDone=true; report.final=true; }
  }

  refreshContracts(s); refreshMarket(s);
  save(); render();
  showWeekReport(report);
}

function marketTable(s){
  const rows=s.rivals.map(r=>({name:r.name,rev:r.qRev,me:false}));
  rows.push({name:s.company,rev:s.qRevenue,me:true});
  rows.sort((a,b)=>b.rev-a.rev);
  return rows;
}
function endQuarter(s){
  const table=marketTable(s);
  const pos=table.findIndex(r=>r.me)+1;
  const total=table.reduce((n,r)=>n+r.rev,0)||1;
  const q=Math.floor((s.week-2)/QUARTER_LEN)+1;
  const out={q,pos,share:Math.round(100*s.qRevenue/total),rev:s.qRevenue,promoted:false,segment:SEGMENTS[s.tier].name};
  const next=SEGMENTS[s.tier+1];
  if(next&&s.rep>=next.repGate){
    s.tier++; out.promoted=true; out.segment=SEGMENTS[s.tier].name;
    s.trophies.push('🚀 Neues Kundensegment: „'+SEGMENTS[s.tier].name+'“ (Woche '+(s.week-1)+')');
    s.rivals=makeRivals(s.tier);
    addMgrXp(s,200);
    addLog(s,'good','🚀 Aufstieg: '+SEGMENTS[s.tier].name+'!');
  }
  s.rivals.forEach(r=>r.qRev=0);
  s.qRevenue=0;
  addMgrXp(s,50);
  return out;
}

/* ---------------- Aktionen ---------------- */
function hireConsultant(id){
  const a=state.market.find(x=>x.id===id); if(!a||state.credits<a.price) return;
  state.credits-=a.price;
  state.market=state.market.filter(x=>x.id!==id);
  delete a.price;
  state.team.push(a);
  addLog(state,'ev','🤝 '+a.name+' verstärkt das Team.');
  save(); render();
}
function fireConsultant(id){
  const a=state.team.find(x=>x.id===id); if(!a||state.team.length<=1) return;
  openModal('Trennung bestätigen',
    '<p>'+esc(a.name)+' verlassen lassen? Abfindung: <b class="num">'+fmt(Math.round(a.salary*2))+' €</b></p>',
    [{label:'Trennen',cls:'mb-main',fn:()=>{ state.credits-=Math.round(a.salary*2); removeConsultant(state,id); addLog(state,'ev','👋 '+a.name+' hat das Team verlassen.'); save(); closeModal(); render(); }},
     {label:'Abbrechen',cls:'mb-alt',fn:closeModal}]);
}
function setTraining(agentId){
  const a=state.team.find(x=>x.id===agentId); if(!a||a.out>0) return;
  if(state.training&&state.training.agentId===agentId){ state.training=null; render(); return; }
  if(state.training) return;
  if(state.contracts.some(c=>c.assigned.includes(agentId))) return;
  let opts='';
  for(const k of Object.keys(SKILLS_C)) opts+='<option value="'+k+'">'+SKILLS_C[k]+' ('+a.stats[k]+')</option>';
  openModal('Weiterbildung: '+esc(a.name),
    '<p class="muted" style="margin-bottom:10px">Fokus wählen (+'+(3+(state.skills.methodik||0))+'–'+(5+(state.skills.methodik||0))+' Punkte, 150 €, eine Woche keine Projekte):</p>'+
    '<select id="train-stat" style="width:100%">'+opts+'</select>',
    [{label:'Weiterbildung buchen',cls:'mb-main',fn:()=>{
        if(state.credits<150){ closeModal(); return; }
        state.credits-=150;
        state.training={agentId,stat:$('train-stat').value};
        save(); closeModal(); render();
      }},
     {label:'Abbrechen',cls:'mb-alt',fn:closeModal}]);
}
function buyTool(key){
  const t=TOOLS[key];
  if(!t||state.tools[key]||state.credits<t.cost) return;
  state.credits-=t.cost; state.tools[key]=true;
  addLog(state,'ev','🧰 Neuer Baustein: '+t.name);
  save(); render();
  if(!state.insights.tool){
    state.insights.tool=true; save();
    openModal('💡 Insight','<p>'+INSIGHTS.tool+'</p><p class="muted" style="margin-top:10px;font-size:.8rem">So arbeitet '+esc(BRAND.agency)+' wirklich.</p>',
      [{label:'Verstanden',cls:'mb-main',fn:closeModal}],'ev');
  }
}
function spendSkill(key){
  if(state.skillPoints<=0||state.skills[key]>=5) return;
  state.skillPoints--; state.skills[key]++;
  addLog(state,'ev','🎓 Skill „'+MSKILLS[key].name+'“ auf Stufe '+state.skills[key]+'.');
  save(); render();
}

/* ---------------- Modal ---------------- */
let modalQueue=[];
function openModal(title,html,buttons,evClass){
  const c=$('modal-content');
  c.innerHTML='<h2 class="'+(evClass||'')+'">'+title+'</h2>'+html;
  const wrap=document.createElement('div'); wrap.className='modal-btns';
  for(const b of buttons){
    const el=document.createElement('button'); el.className=b.cls||'mb-alt'; el.textContent=b.label;
    el.onclick=b.fn; wrap.appendChild(el);
  }
  c.appendChild(wrap);
  $('modal-wrap').classList.remove('hidden');
}
function closeModal(){
  $('modal-wrap').classList.add('hidden');
  if(modalQueue.length){ modalQueue.shift()(); }
}
function queueInsight(key){
  if(!state.insights) state.insights={};
  if(state.insights[key]||!INSIGHTS[key]) return;
  state.insights[key]=true;
  modalQueue.push(()=>openModal('💡 Insight',
    '<p>'+INSIGHTS[key]+'</p><p class="muted" style="margin-top:10px;font-size:.8rem">So arbeitet '+esc(BRAND.agency)+' wirklich.</p>',
    [{label:'Verstanden',cls:'mb-main',fn:closeModal}],'ev'));
}

function showWeekReport(report){
  if(report.gameover){ showGameOver(); return; }
  const s=state;
  if(report.hadCrit) confetti();
  let html='<div style="margin-bottom:14px">';
  for(const r of report.results) html+='<div class="report-item '+r.cls+'">'+r.txt+'</div>';
  html+='</div><h3 style="font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-weight:900">Finanzen</h3>';
  for(const [k,v] of report.fin) html+='<div class="fin-row"><span>'+k+'</span><span class="num">'+v+' €</span></div>';
  html+='<p style="margin-top:12px" class="muted">Umsatz dieses Quartal: <b class="cy num">'+fmt(s.qRevenue)+' €</b> · Segment: '+SEGMENTS[s.tier].name+'</p>';

  modalQueue=[];
  if(report.didWork) queueInsight('sim');
  if(report.hadAdoptFail) queueInsight('adoption');
  if(report.hadTraining) queueInsight('training');
  if(report.hadDisaster) queueInsight('disaster');
  const ev=report.event;
  if(ev){
    modalQueue.push(()=>{
      let evHtml='<p>'+ev.text+'</p>';
      if(state.lastEventNote) evHtml+='<p class="cy" style="margin-top:8px">'+esc(state.lastEventNote)+'</p>';
      if(ev.choices){
        openModal('📡 '+ev.title,evHtml,ev.choices.map(ch=>({
          label:ch.label,cls:'mb-alt',
          fn:()=>{ const res=ch.run(state); save(); render();
            openModal('📡 '+ev.title,'<p>'+esc(res)+'</p>',[{label:'Weiter',cls:'mb-main',fn:closeModal}],'ev'); }
        })),'ev');
      } else {
        openModal('📡 '+ev.title,evHtml,[{label:'Weiter',cls:'mb-main',fn:closeModal}],'ev');
      }
    });
  }
  if(report.quarter){
    const qd=report.quarter;
    modalQueue.push(()=>{
      if(qd.promoted) confetti();
      let t='<p>Quartal '+qd.q+': Platz <b class="cy num">'+qd.pos+'</b> im Markt · Marktanteil <b class="num">'+qd.share+' %</b> · Umsatz <b class="num">'+fmt(qd.rev)+' €</b>.</p>';
      if(qd.promoted) t+='<p class="good" style="margin-top:8px">🚀 Euer Ruf öffnet ein neues Kundensegment: <b>'+qd.segment+'</b> – größere Projekte, stärkere Konkurrenz!</p>';
      else t+='<p class="muted" style="margin-top:8px">Mehr Ruf schaltet das nächste Kundensegment frei.</p>';
      openModal('📊 Quartalsbericht – Q'+qd.q,t,[{label:'Weiter',cls:'mb-main',fn:closeModal}]);
    });
  }
  if(report.final) modalQueue.push(showFinalReport);
  openModal('Wochenreport – Woche '+(s.week-1),html,[{label:'Weiter',cls:'mb-main',fn:closeModal}]);
}

  $('h-credits').className='val num '+(s.credits<0?'bad':s.credits<800?'warn':'');
  $('h-rep').textContent=s.rep+'/100';
  $('h-slots').textContent=usedSlots(s)+'/'+slots(s);
  $('h-mlvl').textContent='Lv '+s.mgrLevel;
  $('h-mxp').style.width=Math.round(100*s.mgrXp/mgrXpNeed(s.mgrLevel))+'%';
}

function renderZentrale(){
  const s=state;
  const table=marketTable(s); const pos=table.findIndex(r=>r.me)+1;
  const salaries=s.team.reduce((n,a)=>n+a.salary,0);
  const cloud=100+40*Object.values(s.tools).filter(Boolean).length;
  const fixcost=SEGMENTS[s.tier].fixcost;
  let toolsHtml='';
  for(const k of Object.keys(TOOLS)){
    const t=TOOLS[k], owned=s.tools[k];
    toolsHtml+='<div class="tool"><div class="tool-icon" style="background:linear-gradient(135deg,'+t.grad[0]+','+t.grad[1]+')">'+t.icon+'</div>'+
      '<div><div class="tool-name">'+t.name+'</div><div class="tool-desc">'+t.desc+'</div></div>'+
      '<div class="own">'+(owned
        ?'<span class="own-badge">✓ im Einsatz</span>'
        :'<button class="btn-buy" onclick="buyTool(\''+k+'\')" '+(s.credits<t.cost?'disabled':'')+'>'+fmt(t.cost)+' €</button>')+'</div></div>';
  }
  let skillHtml='';
  for(const k of Object.keys(MSKILLS)){
    const lvl=s.skills[k];
    let pips=''; for(let i=0;i<5;i++) pips+='<div class="pip'+(i<lvl?' on':'')+'"></div>';
    skillHtml+='<div class="skill"><div><b>'+MSKILLS[k].name+'</b><br><span class="muted" style="font-size:.74rem">'+MSKILLS[k].desc+'</span></div>'+
      '<div style="display:flex;align-items:center;gap:10px"><div class="pips">'+pips+'</div>'+
      '<button class="btn-sm" onclick="spendSkill(\''+k+'\')" '+(s.skillPoints<=0||lvl>=5?'disabled':'')+'>+</button></div></div>';
  }
  let logHtml='';
  for(const l of s.log) logHtml+='<div class="lg-'+l.type+'"><span class="muted num" style="font-size:.68rem">'+l.w+'</span> '+esc(l.msg)+'</div>';
  $('tab-zentrale').innerHTML=
  '<div class="grid grid-2">'+
    '<div class="card"><h3>Lagebericht</h3>'+
      '<div class="kpi"><span>Kundensegment</span><span class="v cy">'+SEGMENTS[s.tier].name+' · Platz '+pos+'</span></div>'+
      '<div class="kpi"><span>Umsatz (Quartal)</span><span class="v num">'+fmt(s.qRevenue)+' €</span></div>'+
      '<div class="kpi"><span>Umsatz (gesamt)</span><span class="v num">'+fmt(s.totalRevenue)+' €</span></div>'+
      '<div class="kpi"><span>Ruf</span><span class="v num">'+s.rep+'/100</span></div>'+
      '<div class="kpi"><span>Meilensteine</span><span class="v num">'+(s.trophies.length||'–')+'</span></div>'+
    '</div>'+
    '<div class="card"><h3>Wöchentliche Kosten</h3>'+
      '<div class="kpi"><span>Gehälter ('+s.team.length+' Personen)</span><span class="v num">−'+fmt(salaries)+' €</span></div>'+
      '<div class="kpi"><span>KI-Tools &amp; Cloud</span><span class="v num">−'+fmt(cloud)+' €</span></div>'+
      '<div class="kpi"><span>Büro</span><span class="v num">−'+fmt(fixcost)+' €</span></div>'+
      '<div class="kpi"><span><b>Summe</b></span><span class="v num bad">−'+fmt(salaries+cloud+fixcost)+' €</span></div>'+
    '</div>'+
    '<div class="card"><h3>🧰 KI-Toolbox</h3>'+toolsHtml+'</div>'+
    '<div class="card"><h3>Deine Manager-Skills <span class="goldc">('+s.skillPoints+' Punkte frei)</span></h3>'+skillHtml+'</div>'+
    '<div class="card" style="grid-column:1/-1"><h3>Logbuch</h3><div class="log">'+(logHtml||'<div>Noch keine Einträge.</div>')+'</div></div>'+
  '</div>';
}

function renderAuftraege(){
  const s=state;
  let html='<div class="slots-info">Team im Einsatz: <b class="cy num">'+usedSlots(s)+'/'+slots(s)+'</b> · max. 2 pro Projekt · 🎓 Schulung erhöht die Akzeptanz deutlich (150 €).</div><div class="grid grid-2">';
  for(const c of s.contracts){
    const uc=USECASES[c.uc];
    const unlocked=hasTool(s,c);
    const chance=projectChance(s,c);
    const adopt=adoptionScore(s,c);
    const chColor=chance>=70?'good':chance>=45?'warn':'bad';
    const adColor=adopt>=70?'good':adopt>=45?'warn':'bad';
    let chips='';
    for(const a of s.team){
      const sel=c.assigned.includes(a.id);
      const other=!sel&&busy(s,a.id);
      const dis=!unlocked||a.out>0||other||(!sel&&c.assigned.length>=2);
      chips+='<button class="chip'+(sel?' sel':'')+'" '+(dis?'disabled':'')+' onclick="toggleAssign('+c.id+','+a.id+')">'+
        '<span class="mini">'+avatarSVG(a.seed,26)+'</span>'+esc(a.name.split(' ')[0])+(a.out>0?' 🤒':other?' ⏳':'')+'</button>';
    }
    html+='<div class="contract'+(c.assigned.length?' assigned-any':'')+(unlocked?'':' locked')+'">'+
      '<div class="c-top">'+clientLogo(c.client)+
        '<div><div class="c-title">'+esc(c.title)+'</div><div class="c-client">'+esc(c.client)+' · '+esc(c.branche)+'</div></div>'+
        '<div class="uc-badge" style="background:linear-gradient(135deg,'+uc.grad[0]+','+uc.grad[1]+')">'+uc.icon+'</div></div>'+
      '<div class="tags"><span class="tag uc">'+uc.label+'</span><span class="tag">'+c.label+'</span>'+
        '<span class="tag">🎯 '+SKILLS_C[uc.skills[0]]+' + '+SKILLS_C[uc.skills[1]]+'</span></div>'+
      '<div class="c-row">'+
        '<span>💰 <b class="num">'+fmt(c.reward)+' €</b></span>'+
        '<span>⭐ +'+c.rep+' Ruf</span>'+
        '<span>Technik: <span class="chance '+chColor+'">'+(c.assigned.length?chance+' %':'–')+'</span></span>'+
        '<span>Akzeptanz: <span class="chance '+adColor+'">'+(c.assigned.length?adopt+' %':'–')+'</span></span>'+
      '</div>'+
      (unlocked
        ?'<div class="addon"><button class="'+(c.schulung?'on':'')+'" onclick="toggleSchulung('+c.id+')" '+(!c.schulung&&s.credits<150?'disabled':'')+'>🎓 Schulung '+(c.schulung?'✓ gebucht':'+ buchen (150 €)')+'</button></div>'+
         '<div class="chips">'+chips+'</div>'
        :'<div class="lock-hint">🔒 Benötigt Baustein „'+TOOLS[uc.tool].name+'“'+
          '<button onclick="buyTool(\''+uc.tool+'\')" '+(s.credits<TOOLS[uc.tool].cost?'disabled':'')+'>Freischalten – '+fmt(TOOLS[uc.tool].cost)+' €</button></div>')+
    '</div>';
  }
  html+='</div>';
  $('tab-auftraege').innerHTML=html;
}

function condColor(v){ return v>=60?'var(--good)':v>=30?'var(--warn)':'var(--bad)'; }

function consultantCard(a,inTeam){
  const s=state, r=roleOf(a), t=traitOf(a);
  let statHtml='';
  for(const k of Object.keys(SKILLS_C)){
    statHtml+='<div class="statrow"><span class="sl">'+SKILLS_C[k]+'</span><div class="statbar"><div style="width:'+a.stats[k]+'%"></div></div><span class="sv">'+a.stats[k]+'</span></div>';
  }
  const inTraining=inTeam&&s.training&&s.training.agentId===a.id;
  const working=inTeam&&s.contracts.some(c=>c.assigned.includes(a.id));
  let actions;
  if(inTeam){
    actions='<span class="muted" style="font-size:.72rem;font-weight:700">Gehalt <b class="num">'+fmt(a.salary)+'</b> €/Wo</span>'+
      '<button class="btn-sm'+(inTraining?' training-on':'')+'" onclick="setTraining('+a.id+')" '+(a.out>0||working||(!inTraining&&s.training)?'disabled':'')+'>'+(inTraining?'Weiterbildung ✓':'Weiterbilden')+'</button>'+
      '<button class="btn-sm danger" onclick="fireConsultant('+a.id+')" '+(s.team.length<=1?'disabled':'')+'>Trennen</button>';
  } else {
    actions='<span class="muted" style="font-size:.72rem;font-weight:700">Gehalt <b class="num">'+fmt(a.salary)+'</b> €/Wo</span>'+
      '<button class="btn-buy" onclick="hireConsultant('+a.id+')" '+(s.credits<a.price?'disabled':'')+'>Einstellen – '+fmt(a.price)+' €</button>';
  }
  return '<div class="agent'+(a.out>0?' out':'')+'">'+
    '<div class="a-top"><div class="avatar">'+avatarSVG(a.seed,60)+'</div>'+
      '<div><div class="a-name">'+esc(a.name)+'</div><div class="a-role">'+r.name+
      (a.out>0?' · <span class="bad">🤒 '+a.out+' Wo. raus</span>':working?' · <span class="cy">im Projekt</span>':inTraining?' · <span class="vio">in Weiterbildung</span>':'')+
      '</div><div class="a-trait">'+t.name+' – '+t.desc+'</div></div>'+
      '<div class="lvl-chip">Lv '+a.level+'</div></div>'+
    statHtml+
    '<div class="xpbar"><div style="width:'+Math.round(100*a.xp/xpNeed(a.level))+'%"></div></div>'+
    '<div class="meters">'+
      '<div class="meter"><div class="lbl"><span>Energie</span><span class="num">'+a.cond+'</span></div><div class="mbar"><div style="width:'+a.cond+'%;background:'+condColor(a.cond)+'"></div></div></div>'+
      '<div class="meter"><div class="lbl"><span>Stimmung</span><span class="num">'+a.morale+'</span></div><div class="mbar"><div style="width:'+a.morale+'%;background:'+condColor(a.morale)+'"></div></div></div>'+
    '</div>'+
    '<div class="a-actions">'+actions+'</div>'+
  '</div>';
}

function renderTeam(){
  const s=state;
  let html='<div class="slots-info">Weiterbildungs-Slot: <b class="vio num">'+(s.training?1:0)+'/1</b> · Weiterbildung kostet 150 € und den Projekteinsatz der Woche.</div><div class="grid grid-3">';
  for(const a of s.team) html+=consultantCard(a,true);
  html+='</div>';
  $('tab-team').innerHTML=html;
}
function renderMarkt(){
  const s=state;
  let html='<div class="slots-info">Recruiting-Stufe <b class="vio">'+(s.skills.recruiting||0)+'</b> · Neue Bewerbungen jede Woche.</div><div class="grid grid-3">';
  if(s.market.length===0) html+='<p class="muted">Diese Woche keine Bewerbungen.</p>';
  for(const a of s.market) html+=consultantCard(a,false);
  html+='</div>';
  $('tab-markt').innerHTML=html;
}

function renderLiga(){
  const s=state;
  const table=marketTable(s);
  const total=table.reduce((n,r)=>n+r.rev,0)||1;
  let rows='';
  table.forEach((r,i)=>{
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';
    rows+='<tr class="'+(r.me?'me':'')+'"><td><span class="rank-medal">'+medal+'</span></td><td>'+esc(r.name)+(r.me?' ★':'')+'</td><td class="num">'+fmt(r.rev)+'</td><td class="num">'+Math.round(100*r.rev/total)+' %</td></tr>';
  });
  let ladder='';
  SEGMENTS.slice().reverse().forEach((L,i)=>{
    const tier=SEGMENTS.length-1-i;
    const status=tier===s.tier?'DEIN SEGMENT':tier<s.tier?'erschlossen':'ab Ruf '+L.repGate;
    ladder+='<div class="kpi"><span>'+(tier===s.tier?'▶ ':'')+L.name+'</span><span class="v '+(tier===s.tier?'cy':tier<s.tier?'good':'muted')+'">'+status+'</span></div>';
  });
  let troph='';
  if(s.trophies.length) troph='<div class="card" style="margin-top:16px"><h3>Meilensteine</h3>'+s.trophies.map(t=>'<div class="kpi"><span>'+esc(t)+'</span></div>').join('')+'</div>';
  $('tab-liga').innerHTML=
  '<div class="grid grid-2">'+
    '<div class="card"><h3>Markt-Ranking · '+SEGMENTS[s.tier].name+' · Quartal '+(Math.floor((s.week-1)/QUARTER_LEN)+1)+'</h3>'+
      '<table><thead><tr><th></th><th>Beratung</th><th class="num">Umsatz (€)</th><th class="num">Anteil</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      '<p class="muted" style="font-size:.74rem;margin-top:10px;font-weight:700">Umsätze im laufenden Quartal. Liegengelassene Anfragen landen bei der Konkurrenz.</p>'+
    '</div>'+
    '<div><div class="card"><h3>Kundensegmente</h3>'+ladder+
      '<p class="muted" style="font-size:.74rem;margin-top:10px;font-weight:700">Aufstieg über Ruf – Referenzen öffnen größere Kunden. Kein Zwangsabstieg, nur Marktdruck.</p>'+
    '</div>'+troph+'</div>'+
  '</div>';
}

/* ---------------- Save / Load ---------------- */
function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify({state,uid})); }catch(e){} }
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d=JSON.parse(raw);
    if(!d.state||!d.state.company) return false;
    state=d.state; uid=d.uid||1000;
    return true;
  }catch(e){ return false; }
}
function resetGame(skipConfirm){
  const doReset=()=>{ localStorage.removeItem(SAVE_KEY); location.reload(); };
  if(skipConfirm===true){ doReset(); return; }
  openModal('Spielstand löschen?','<p>Der komplette Fortschritt geht verloren.</p>',
    [{label:'Ja, neu starten',cls:'mb-main',fn:doReset},{label:'Abbrechen',cls:'mb-alt',fn:closeModal}]);
}

/* ---------------- Init ---------------- */
function foundCompany(){
  const company=$('inp-company').value.trim();
  const manager=$('inp-manager').value.trim();
  if(!company||!manager){
    $('inp-company').style.borderColor=company?'var(--line)':'var(--bad)';
    $('inp-manager').style.borderColor=manager?'var(--line)':'var(--bad)';
    return;
  }
  state=newState(company,manager);
  save(); startUI();
}
function continueGame(){ if(load()) startUI(); }
function startUI(){
  $('start-screen').classList.add('hidden');
  $('game').classList.remove('hidden');
  showTab('zentrale');
}
(function init(){
  if(localStorage.getItem(SAVE_KEY)) $('btn-continue').classList.remove('hidden');
})();
</script>
